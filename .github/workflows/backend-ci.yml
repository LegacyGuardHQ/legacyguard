name: Backend CI

"on":
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install dependency auditor
        run: python -m pip install pip-audit==2.10.1

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run tests
        run: python -m pytest

  postgresql:
    name: PostgreSQL migrations and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: legacyguard_test
          POSTGRES_USER: legacyguard_test
          POSTGRES_PASSWORD: legacyguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legacyguard_test -d legacyguard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://legacyguard_test:legacyguard_test@localhost:5432/legacyguard_test
      ENVIRONMENT: testing
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Migrate an empty PostgreSQL database to head
        run: python -m alembic upgrade head

      - name: Verify migration readiness
        run: python -c "from app.services.alembic_readiness import check_migration_readiness; raise SystemExit(0 if check_migration_readiness() else 1)"

      - name: Run backend tests against PostgreSQL
        run: python -m pytest
