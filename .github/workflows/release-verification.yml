name: Release verification

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - "release/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Backend release checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend test suite
        run: python -m pytest

  frontend:
    name: Frontend release checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  release-gate:
    name: RC readiness gate
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Alembic migration state
        run: |
          ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export ENCRYPTION_KEY
          export SECRET_KEY
          export JWT_SECRET
          PYTHONPATH=. python -m alembic upgrade head
      - name: Run production smoke test
        run: python ../scripts/production_smoke_test.py

# Recovery repository workflow registration
