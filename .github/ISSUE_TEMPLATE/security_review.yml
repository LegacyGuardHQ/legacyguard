name: Security hardening review
description: Propose non-sensitive security review or hardening work. Report vulnerabilities privately.
title: "[Security review]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This public form is only for non-sensitive defensive review proposals. Do not disclose vulnerability details, credentials, personal, financial, or estate information, uploaded documents, or other sensitive evidence here. Report vulnerabilities only through the private route in SECURITY.md.
  - type: checkboxes
    attributes:
      label: Disclosure check
      options:
        - label: This issue does not disclose a new exploitable vulnerability or sensitive evidence.
          required: true
        - label: I removed secrets, personal information, and production data.
          required: true
  - type: dropdown
    attributes:
      label: Review area
      options:
        - Authentication and sessions
        - Authorization and owner scoping
        - Encryption and key handling
        - Audit and logging
        - Document processing
        - Dependency or supply-chain safety
        - Deployment and operations
        - Threat modeling
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed review
      description: Define the defensive question, scope, and expected deliverable.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Acceptance criteria
      description: How will the review or hardening work be considered complete?
    validations:
      required: true
