name: Accessibility report
description: Report a barrier without sharing unnecessary health information.
title: "[Accessibility]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Lived experience is valuable, and no diagnosis or personal medical information is required. Never include real continuity records.
  - type: textarea
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    attributes:
      label: What barrier did you encounter?
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Interaction method
      multiple: true
      options:
        - Keyboard
        - Screen reader
        - Voice control
        - Touch
        - Zoom or magnification
        - Reduced motion
        - Color or contrast
        - Cognitive or language accessibility
        - Other or not sure
  - type: textarea
    attributes:
      label: Relevant environment
      description: Browser, operating system, and assistive technology, if you are comfortable sharing.
  - type: textarea
    attributes:
      label: What would make this easier?
  - type: checkboxes
    attributes:
      label: Privacy check
      options:
        - label: I did not include real continuity records or unnecessary health information.
          required: true

