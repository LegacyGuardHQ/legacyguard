name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data only. Do not post vulnerability details, credentials, personal information, financial or estate information, uploaded documents, or other sensitive material in this public issue. Report security vulnerabilities only through a verified private route in SECURITY.md.
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I used synthetic data and removed secrets and personal information.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Provide the smallest safe example that reproduces the problem.
    validations:
      required: true
  - type: input
    attributes:
      label: Version or commit
      placeholder: v1.1.0-rc.1 or commit SHA
  - type: textarea
    attributes:
      label: Environment
      description: Operating system, browser, and relevant runtime versions.
  - type: textarea
    attributes:
      label: Additional context
      description: Sanitized logs or screenshots only.
