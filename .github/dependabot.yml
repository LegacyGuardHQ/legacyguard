version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      backend-dependencies:
        patterns:
          - "*"
    ignore:
      # Passlib 1.7.4 cannot initialize its bcrypt backend with bcrypt 5.x.
      - dependency-name: bcrypt
        update-types:
          - version-update:semver-major
      # Keep the authentication stack on the validated bcrypt release until
      # Passlib is replaced or upgraded and the full compatibility suite passes.
      - dependency-name: bcrypt
        versions:
          - ">4.0.1"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      frontend-typescript:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"
        update-types:
          - minor
          - patch
      frontend-react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      frontend-react-router:
        patterns:
          - "react-router"
          - "react-router-dom"
        update-types:
          - minor
          - patch
      frontend-test-runtime:
        patterns:
          - "jsdom"
          - "vitest"
          - "@testing-library/*"
        update-types:
          - minor
          - patch
      frontend-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-router"
          - "react-router-dom"
          - "jsdom"
          - "vitest"
          - "@testing-library/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
