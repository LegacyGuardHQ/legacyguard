version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      backend-dependencies:
        patterns:
          - "*"
    ignore:
      # Passlib 1.7.4 cannot initialize its bcrypt backend with bcrypt 5.x.
      - dependency-name: bcrypt
        update-types:
          - version-update:semver-major
      # Keep the authentication stack on the validated bcrypt release until
      # Passlib is replaced or upgraded and the full compatibility suite passes.
      - dependency-name: bcrypt
        versions:
          - ">4.0.1"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
